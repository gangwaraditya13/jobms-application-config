spring.application.name=reviewmsApplication

server.port=8082

job-service.url=http://job:8080
company-service.url=http://company:8081
review-service.url=http://review:8082

#MySql
# spring.datasource.url=jdbc:mysql://localhost:3306/reviewmsappdb
